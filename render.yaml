# Render blueprint for the Vector Studio API.
# Frontend stays on Vercel (web/).
#
# Uses free plan so it works on Hobby without a credit card.
# Note: free instances sleep after idle; upgrade to Starter later for always-on.
services:
  - type: web
    name: vectorstudio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_STORAGE_DIR
        value: /opt/render/project/src/server/storage
      - key: WORKER_CONCURRENCY
        value: "6"
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
